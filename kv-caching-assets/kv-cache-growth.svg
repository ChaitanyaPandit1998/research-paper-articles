<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<rect x="0" y="0" width="720" height="320" fill="#fffef9"/>
<defs>
  <marker id="arrowF" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#1c201f4a"/>
  </marker>
</defs>
<text x="24" y="26" font-size="14" fill="#1c201f" font-weight="700" font-family="Georgia,ui-serif,serif">Without a KV cache vs. with a KV cache, generating token 4</text>
<text x="696" y="26" font-size="10.5" fill="#565f5b" text-anchor="end">same model, same prompt, two strategies</text>

<!-- Without cache -->
<text x="24" y="58" font-size="12" fill="#1c201f" font-weight="600">Without caching — recompute K,V for every token, every step</text>
<rect x="24" y="70" width="48" height="34" rx="3" fill="#f2efe6" stroke="#1c201f4a" stroke-width="1.2"/>
<text x="48" y="91" font-size="11" text-anchor="middle" fill="#1c201f">t1</text>
<rect x="80" y="70" width="48" height="34" rx="3" fill="#f2efe6" stroke="#1c201f4a" stroke-width="1.2"/>
<text x="104" y="91" font-size="11" text-anchor="middle" fill="#1c201f">t2</text>
<rect x="136" y="70" width="48" height="34" rx="3" fill="#f2efe6" stroke="#1c201f4a" stroke-width="1.2"/>
<text x="160" y="91" font-size="11" text-anchor="middle" fill="#1c201f">t3</text>
<rect x="192" y="70" width="48" height="34" rx="3" fill="#e8dfc8" stroke="#a8641a" stroke-width="1.4"/>
<text x="216" y="91" font-size="11" text-anchor="middle" fill="#a8641a" font-weight="700">t4</text>
<text x="252" y="92" font-size="11" fill="#565f5b">&#8592; recompute K,V for t1, t2, t3 all over again, then t4</text>

<!-- With cache -->
<text x="24" y="140" font-size="12" fill="#1c201f" font-weight="600">With a KV cache — reuse stored K,V, compute only the new token</text>
<rect x="24" y="152" width="48" height="34" rx="3" fill="#dfeee2" stroke="#3f7d55" stroke-width="1.2"/>
<text x="48" y="173" font-size="11" text-anchor="middle" fill="#3f7d55">t1</text>
<text x="48" y="200" font-size="9.5" text-anchor="middle" fill="#565f5b">cached</text>
<rect x="80" y="152" width="48" height="34" rx="3" fill="#dfeee2" stroke="#3f7d55" stroke-width="1.2"/>
<text x="104" y="173" font-size="11" text-anchor="middle" fill="#3f7d55">t2</text>
<text x="104" y="200" font-size="9.5" text-anchor="middle" fill="#565f5b">cached</text>
<rect x="136" y="152" width="48" height="34" rx="3" fill="#dfeee2" stroke="#3f7d55" stroke-width="1.2"/>
<text x="160" y="173" font-size="11" text-anchor="middle" fill="#3f7d55">t3</text>
<text x="160" y="200" font-size="9.5" text-anchor="middle" fill="#565f5b">cached</text>
<rect x="192" y="152" width="48" height="34" rx="3" fill="#e8dfc8" stroke="#a8641a" stroke-width="1.4"/>
<text x="216" y="173" font-size="11" text-anchor="middle" fill="#a8641a" font-weight="700">t4</text>
<text x="216" y="200" font-size="9.5" text-anchor="middle" fill="#a8641a">new</text>
<text x="252" y="174" font-size="11" fill="#565f5b">&#8592; K,V for t1-t3 read straight from memory; only t4 is computed</text>

<text x="24" y="250" font-size="11" fill="#565f5b">Cost without caching to generate N tokens: roughly 1+2+3+...+N &#8776; O(N&#178;) key/value computations.</text>
<text x="24" y="268" font-size="11" fill="#565f5b">Cost with caching: exactly N key/value computations, one per new token &#8594; O(N). The cache trades memory for this savings.</text>
<text x="24" y="296" font-size="11" fill="#565f5b">The Q vector is never cached — only K and V are, because every new token needs a fresh query, but past keys/values never change once written.</text>
</svg>
