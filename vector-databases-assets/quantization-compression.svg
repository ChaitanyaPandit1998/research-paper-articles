<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<rect x="0" y="0" width="720" height="380" fill="#fffef9"/>
<text x="24" y="26" font-size="14" fill="#1c201f" font-weight="700" font-family="Georgia,ui-serif,serif">Memory per vector, by quantization scheme</text>
<text x="696" y="26" font-size="10.5" fill="#565f5b" text-anchor="end">768-dim vector, float32 baseline = 3,072 bytes</text>

<!-- axis -->
<line x1="90" y1="300" x2="680" y2="300" stroke="#1c201f4a" stroke-width="1.2"/>

<!-- bars: baseline, scalar, turbo4, product, turbo2, binary, turbo1 -->
<!-- height scale: 240px = 3072 bytes -->
<!-- float32: 3072 -> 240px -->
<rect x="80" y="60" width="70" height="240" fill="#1c201f26" stroke="#1c201f4a" stroke-width="1.2"/>
<text x="115" y="50" font-size="10.5" fill="#1c201f" text-anchor="middle" font-weight="600">float32</text>
<text x="115" y="316" font-size="10" fill="#565f5b" text-anchor="middle">3072 B</text>
<text x="115" y="330" font-size="9.5" fill="#565f5b" text-anchor="middle">1x</text>

<!-- scalar: 768 bytes -> 60px -->
<rect x="180" y="240" width="70" height="60" fill="#f2efe6" stroke="#1c201f4a" stroke-width="1.2"/>
<text x="215" y="230" font-size="10.5" fill="#1c201f" text-anchor="middle" font-weight="600">scalar</text>
<text x="215" y="316" font-size="10" fill="#565f5b" text-anchor="middle">768 B</text>
<text x="215" y="330" font-size="9.5" fill="#565f5b" text-anchor="middle">4x</text>

<!-- turbo 4-bit: 384 bytes -> 30px -->
<rect x="280" y="270" width="70" height="30" fill="#f2efe6" stroke="#a8641a" stroke-width="1.4"/>
<text x="315" y="260" font-size="10.5" fill="#1c201f" text-anchor="middle" font-weight="600">TurboQuant</text>
<text x="315" y="273" font-size="9.5" fill="#1c201f" text-anchor="middle">4-bit</text>
<text x="315" y="316" font-size="10" fill="#565f5b" text-anchor="middle">384 B</text>
<text x="315" y="330" font-size="9.5" fill="#565f5b" text-anchor="middle">8x</text>

<!-- product: 192 bytes -> 15px (16x example config; up to 64x possible) -->
<rect x="380" y="285" width="70" height="15" fill="#f2efe6" stroke="#1c201f4a" stroke-width="1.2"/>
<text x="415" y="275" font-size="10.5" fill="#1c201f" text-anchor="middle" font-weight="600">product</text>
<text x="415" y="316" font-size="10" fill="#565f5b" text-anchor="middle">192 B</text>
<text x="415" y="330" font-size="9.5" fill="#565f5b" text-anchor="middle">16x (up to 64x)</text>

<!-- turbo 2-bit: 192 bytes -> 15px (16x) -->
<rect x="480" y="285" width="70" height="15" fill="#f2efe6" stroke="#a8641a" stroke-width="1.4"/>
<text x="515" y="260" font-size="10.5" fill="#1c201f" text-anchor="middle" font-weight="600">TurboQuant</text>
<text x="515" y="273" font-size="9.5" fill="#1c201f" text-anchor="middle">2-bit</text>
<text x="515" y="316" font-size="10" fill="#565f5b" text-anchor="middle">192 B</text>
<text x="515" y="330" font-size="9.5" fill="#565f5b" text-anchor="middle">16x</text>

<!-- binary: 96 bytes -> ~7.5px (32x) -->
<rect x="580" y="292" width="60" height="8" fill="#f2efe6" stroke="#1c201f4a" stroke-width="1.2"/>
<text x="610" y="282" font-size="10.5" fill="#1c201f" text-anchor="middle" font-weight="600">binary</text>
<text x="610" y="316" font-size="10" fill="#565f5b" text-anchor="middle">96 B</text>
<text x="610" y="330" font-size="9.5" fill="#565f5b" text-anchor="middle">32x</text>

<text x="40" y="354" font-size="11" fill="#565f5b">Bar height is memory per vector, log-flattened for legibility — binary quantization and TurboQuant's</text>
<text x="40" y="368" font-size="11" fill="#565f5b">1-bit variant (not pictured, same footprint as binary) reach the same ~32x compression by different routes.</text>
</svg>
