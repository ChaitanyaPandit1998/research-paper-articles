<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<rect x="0" y="0" width="720" height="380" fill="#fffef9"/>
<defs>
  <marker id="arrowF" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#1c201f4a"/>
  </marker>
</defs>
<text x="24" y="26" font-size="14" fill="#1c201f" font-weight="700" font-family="Georgia,ui-serif,serif">Hybrid search: two ranked lists, one fused ranking</text>
<text x="696" y="26" font-size="10.5" fill="#565f5b" text-anchor="end">reciprocal rank fusion</text>

<!-- query -->
<rect x="300" y="46" width="120" height="38" rx="3" fill="#f2efe6" stroke="#1c201f4a" stroke-width="1.4"/>
<text x="360" y="70" font-size="12" fill="#1c201f" text-anchor="middle" font-weight="600">query</text>
<line x1="330" y1="84" x2="180" y2="112" stroke="#1c201f4a" stroke-width="1.4" marker-end="url(#arrowF)"/>
<line x1="390" y1="84" x2="540" y2="112" stroke="#1c201f4a" stroke-width="1.4" marker-end="url(#arrowF)"/>

<!-- dense search box -->
<rect x="60" y="116" width="240" height="40" rx="3" fill="#f2efe6" stroke="#1c201f4a" stroke-width="1.4"/>
<text x="180" y="140" font-size="12" fill="#1c201f" text-anchor="middle" font-weight="600">dense ANN search</text>

<!-- sparse search box -->
<rect x="420" y="116" width="240" height="40" rx="3" fill="#f2efe6" stroke="#1c201f4a" stroke-width="1.4"/>
<text x="540" y="140" font-size="12" fill="#1c201f" text-anchor="middle" font-weight="600">sparse search (BM25 / SPLADE)</text>

<line x1="180" y1="156" x2="180" y2="182" stroke="#1c201f4a" stroke-width="1.4" marker-end="url(#arrowF)"/>
<line x1="540" y1="156" x2="540" y2="182" stroke="#1c201f4a" stroke-width="1.4" marker-end="url(#arrowF)"/>

<!-- ranked list A -->
<rect x="60" y="186" width="240" height="96" rx="3" fill="none" stroke="#1c201f33" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="72" y="202" font-size="10.5" fill="#565f5b" font-style="italic">ranked list A</text>
<text x="72" y="220" font-size="11" fill="#1c201f">1. Troubleshooting transactions</text>
<text x="72" y="236" font-size="11" fill="#1c201f">2. Refund policy overview</text>
<text x="72" y="252" font-size="11" fill="#a8641a">15. Resolving error E-4471</text>

<!-- ranked list B -->
<rect x="420" y="186" width="240" height="96" rx="3" fill="none" stroke="#1c201f33" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="432" y="202" font-size="10.5" fill="#565f5b" font-style="italic">ranked list B</text>
<text x="432" y="220" font-size="11" fill="#a8641a">1. Resolving error E-4471</text>
<text x="432" y="236" font-size="11" fill="#1c201f">2. Troubleshooting transactions</text>
<text x="432" y="252" font-size="11" fill="#1c201f">3. Payment gateway status codes</text>

<line x1="180" y1="282" x2="330" y2="312" stroke="#1c201f4a" stroke-width="1.4" marker-end="url(#arrowF)"/>
<line x1="540" y1="282" x2="390" y2="312" stroke="#1c201f4a" stroke-width="1.4" marker-end="url(#arrowF)"/>

<!-- RRF box -->
<rect x="270" y="296" width="180" height="34" rx="3" fill="#a8641a1f" stroke="#a8641a" stroke-width="1.4"/>
<text x="360" y="317" font-size="11.5" fill="#1c201f" text-anchor="middle" font-weight="600">RRF: score = Σ 1/(k+rank)</text>

<line x1="360" y1="330" x2="360" y2="348" stroke="#1c201f4a" stroke-width="1.4" marker-end="url(#arrowF)"/>
<text x="360" y="366" font-size="11.5" fill="#1c201f" text-anchor="middle" font-weight="600">1. Resolving error E-4471  ·  2. Troubleshooting transactions  ·  ...</text>
</svg>
